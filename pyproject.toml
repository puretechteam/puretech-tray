[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "puretech-tray"
version = "0.1.0"
description = "Native Windows tray icon in pure ctypes: menus with checkboxes, radio items and submenus, dark mode, toast notifications with buttons. Zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pure Tech" }]
keywords = ["tray", "systray", "notification area", "toast", "windows", "ctypes"]
classifiers = [
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Desktop Environment",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/puretechteam/puretech-tray"

[tool.setuptools]
packages = ["puretech_tray"]

[tool.pytest.ini_options]
testpaths = ["tests"]
